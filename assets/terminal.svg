<svg xmlns="http://www.w3.org/2000/svg" width="880" height="354" viewBox="0 0 880 354" role="img" aria-labelledby="title desc">
  <title id="title">Jesús Juárez Ramírez · Software, Cloud e IA aplicada</title>
  <desc id="desc">Terminal oscura con un circuito animado, líneas de señal en verde menta y un cursor intermitente.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#091619"/><stop offset=".57" stop-color="#071115"/><stop offset="1" stop-color="#0E2425"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#45E7A6" stop-opacity=".20"/><stop offset="1" stop-color="#45E7A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x2="1" y2="1">
      <stop stop-color="#ABFFD6"/><stop offset="1" stop-color="#49DCA5"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7AEAC0" stroke-opacity=".15"/>
    </pattern>
    <clipPath id="window"><rect x="1" y="1" width="878" height="352" rx="20"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .sans { font-family: system-ui, 'Segoe UI', sans-serif; }
      .signal { stroke-dasharray: 16 420; animation: signal 5s linear infinite; }
      .signal-b { animation-delay: -2.1s; }
      .signal-c { animation-delay: -3.4s; }
      .beacon { animation: breathe 4s ease-in-out infinite; transform-origin: 700px 197px; }
      .cursor { animation: blink 1.3s steps(1,end) infinite; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes signal { from { stroke-dashoffset: 436; } to { stroke-dashoffset: 0; } }
      @keyframes breathe { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
      @keyframes blink { 0%,100% { opacity: 1; } 55% { opacity: .14; } }
      @keyframes sweep { 0%,16% { transform: translateY(0); opacity: 0; } 30%,65% { opacity: .55; } 82%,100% { transform: translateY(140px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .signal,.beacon,.cursor,.sweep { animation: none; }
        .sweep,.signal { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <rect width="880" height="354" fill="url(#bg)"/>
    <rect x="481" y="50" width="399" height="304" fill="url(#grid)" opacity=".44"/>
    <ellipse cx="704" cy="195" rx="226" ry="173" fill="url(#halo)"/>
    <path d="M0 48H880M491 71V329" fill="none" stroke="#274545"/>
    <path d="M1 1H240" stroke="#79F4C3" stroke-opacity=".8"/>
    <circle cx="25" cy="25" r="4" fill="#517069"/>
    <circle cx="40" cy="25" r="4" fill="#517069"/>
    <circle cx="55" cy="25" r="4" fill="#78F5C3"/>
    <text x="75" y="30" class="mono" font-size="14" fill="#A7C3B9">~/perfil</text>
    <text x="855" y="30" text-anchor="end" class="mono" font-size="11" letter-spacing="1.6" fill="#83B6A6">GITHUB / PORTAFOLIO</text>

    <text x="48" y="97" class="mono" font-size="12" letter-spacing="2.3" fill="#A4C8BB">INGENIERÍA EN TI</text>
    <text x="45" y="164" class="sans" font-size="63" font-weight="770" letter-spacing="-3.5" fill="#F1F8F5">Jesús Juárez</text>
    <text x="45" y="224" class="sans" font-size="63" font-weight="770" letter-spacing="-3.5" fill="url(#mint)">Ramírez</text>
    <text x="49" y="269" class="sans" font-size="20" font-weight="520" fill="#D2E5DD">Software · Cloud · IA aplicada</text>
    <path d="M49 292H437" stroke="#294641"/>
    <text x="49" y="321" class="mono" font-size="15" fill="#91EAC5">$</text>
    <text x="68" y="321" class="mono" font-size="15" fill="#A7C3B9">./explorar</text>
    <rect x="165" y="307" width="8" height="17" rx="1" fill="#77F5C1" class="cursor"/>

    <g fill="none" stroke="#335B51" stroke-width="1.3">
      <path d="M515 113H566L596 143H653"/>
      <path d="M524 164H585L607 186H652"/>
      <path d="M527 274H584L630 228H651"/>
      <path d="M694 149V106L714 86H819"/>
      <path d="M748 175H791L816 150H852"/>
      <path d="M749 215H787L818 246H858"/>
      <path d="M713 246V283L738 308H822"/>
      <path d="M615 306H639L671 274V246"/>
    </g>
    <g fill="#112721" stroke="#65B89A" stroke-width="1.4">
      <circle cx="515" cy="113" r="3.5"/><circle cx="524" cy="164" r="3.5"/>
      <circle cx="527" cy="274" r="3.5"/><circle cx="819" cy="86" r="3.5"/>
      <circle cx="852" cy="150" r="3.5"/><circle cx="858" cy="246" r="3.5"/>
      <circle cx="822" cy="308" r="3.5"/><circle cx="615" cy="306" r="3.5"/>
    </g>
    <g fill="none" stroke="#9BFFD4" stroke-width="2.5" stroke-linecap="round">
      <path class="signal" d="M515 113H566L596 143H653"/>
      <path class="signal signal-b" d="M527 274H584L630 228H651"/>
      <path class="signal signal-c" d="M748 175H791L816 150H852"/>
      <path class="signal" d="M713 246V283L738 308H822"/>
      <path class="signal signal-b" d="M819 86H714L694 106V149"/>
      <path class="signal signal-c" d="M858 246H818L787 215H749"/>
    </g>
    <rect x="630" y="127" width="140" height="140" rx="22" fill="none" stroke="#61CDA4" stroke-opacity=".7" stroke-dasharray="2 7" class="beacon"/>
    <rect x="644" y="141" width="112" height="112" rx="17" fill="#0A1E1D" stroke="#53A991"/>
    <rect x="652" y="149" width="96" height="96" rx="12" fill="#102925" stroke="#396659"/>
    <path d="m676 182 16 15-16 15m28 0h20" fill="none" stroke="#ABFFD6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M615 125H785" stroke="#A0FFD6" stroke-width="1.2" class="sweep" opacity="0"/>
  </g>
  <rect x="1" y="1" width="878" height="352" rx="20" fill="none" stroke="#315350" stroke-width="2"/>
</svg>
